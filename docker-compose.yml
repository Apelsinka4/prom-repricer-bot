services:
  prom-repricer-bot:
    build: .
    container_name: prom-repricer-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCRAPER_HEADLESS: ${SCRAPER_HEADLESS:-true}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-3600}
      WORKER_TASK_DELAY_SECONDS: ${WORKER_TASK_DELAY_SECONDS:-2}
      MAX_COMPETITORS_PER_TASK: ${MAX_COMPETITORS_PER_TASK:-5}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-10}
      RATE_LIMIT_MAX_EVENTS: ${RATE_LIMIT_MAX_EVENTS:-8}
      RATE_LIMIT_BLOCK_SECONDS: ${RATE_LIMIT_BLOCK_SECONDS:-20}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
